# Serves the built Vite SPA, reverse-proxies API/admin/static to the `backend`
# service, and serves uploaded media (avatars) directly from a volume shared
# with backend - see docker-compose.yml. Frontend and "backend as the browser
# sees it" end up on one origin this way, so no CORS is needed between them.
#
# The backend container has no port published to the host at all (see
# docker-compose.yml's backend service) - this is the *only* way in.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /report/42) aren't real files -
    # fall back to index.html and let the SPA's own router handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls (suggestions/explanation/refactor/chat) and PDF report
        # generation can legitimately take a while - the default 60s would
        # cut those off mid-request.
        proxy_read_timeout 120s;
    }

    # Served directly by nginx from the shared media_data volume, not
    # proxied to Django - avatars are public-by-design, and nginx serving
    # static files from disk is exactly what it's built for (unlike Django's
    # own file-serving view, which its docs call out as dev-only/inefficient).
    # `alias` (not `root`) so the /media/ prefix is stripped: a request for
    # /media/avatars/x.png maps to <path>/avatars/x.png, matching how
    # MEDIA_ROOT/MEDIA_URL are laid out on the backend side.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
