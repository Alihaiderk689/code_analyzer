# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploys the Django backend (web service), the Celery worker that powers
# async GitHub PR review, and a managed Redis instance for the Celery
# broker/result backend. Run via Render's dashboard: New > Blueprint,
# pointing at this repo.
#
# NOTE: Render's Blueprint schema (especially the managed Redis/"Key Value"
# service type's exact field names) has changed over time. Treat this file as
# a solid starting point, not guaranteed-correct - check it against Render's
# current Blueprint docs the first time you run it, since this couldn't be
# tested against Render's actual API from here.
#
# Every `sync: false` env var is a secret/deployment-specific value you must
# set yourself in the Render dashboard after the blueprint creates the
# service - never put real secrets in this file, which is committed to git.

envVarGroups:
  - name: code-analyzer-shared
    envVars:
      # Shared by BOTH the web service and the Celery worker. Django validates
      # this at startup in production (core/settings_validation.py) regardless
      # of whether the process serves HTTP, so the worker cannot boot without
      # it - it must live in the shared group, not on the web service alone.
      # The worker never handles requests, so its value is only satisfying the
      # check; the web service's value is the one that matters for Host
      # header validation.
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL_PROD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_BASE_URL
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false

services:
  - type: web
    name: code-analyzer-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health/
    # Uploaded avatars (MEDIA_ROOT) live here. Without a disk the container
    # filesystem is ephemeral, so every deploy silently destroyed them.
    # Attached to the web service only - it is the sole process that writes or
    # serves media, and a Render disk cannot be shared between services.
    disk:
      name: code-analyzer-media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - fromGroup: code-analyzer-shared
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: code-analyzer-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: code-analyzer-redis
          property: connectionString

  - type: worker
    name: code-analyzer-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker --loglevel=info
    plan: starter
    envVars:
      - fromGroup: code-analyzer-shared
      - key: ENVIRONMENT
        value: production
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: code-analyzer-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: code-analyzer-redis
          property: connectionString

  - type: keyvalue
    name: code-analyzer-redis
    plan: starter
    ipAllowList: []
