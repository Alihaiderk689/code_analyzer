name: Deploy

# The delivery half of the pipeline, split out from ci.yml so the gate and the
# release are separate concerns: ci.yml decides whether a commit is good, this
# decides what to do about it. ci.yml declares `workflow_call`, so the `ci`
# job below runs the real thing rather than a copy of it - there is exactly
# one definition of "the tests" in this repo and it cannot drift.
on:
  push:
    branches: [main]
  # Re-run a deploy without pushing an empty commit - after fixing a secret,
  # or to redeploy a commit whose provider-side build failed.
  workflow_dispatch:

# Never cancel a deploy. `cancel-in-progress` elsewhere is a convenience;
# here it would abort a half-finished rollout and leave the two services on
# different commits. Queued deploys run in order instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Calls ci.yml as a reusable workflow. Its jobs appear nested under this
  # run, so a failure shows up as "ci / backend" rather than an opaque
  # dependency that failed somewhere else.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    # `needs: ci` is the whole gate: the reusable workflow above must have
    # gone green - backend tests, frontend lint/test/build, both audits -
    # before a single hook is fired. There is no `if:` on branch or event any
    # more; this workflow only triggers on push to main, so the condition that
    # used to live here is now the trigger itself.
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    # Backstop only - each of the three waits has its own 15-minute deadline,
    # so 45 is the real ceiling. Were a required reviewer ever added to the
    # production environment, that pause happens before the job starts and is
    # not counted against this.
    timeout-minutes: 60
    steps:
      # Two commits deep is all this needs: HEAD and its first parent, which
      # for a merge commit is the previous tip of main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Vercel skips a build when nothing under its Root Directory (frontend)
      # changed, and reports that skip as CANCELED - the same state a genuinely
      # failed or superseded build gets. Without knowing whether this commit
      # touched the frontend at all, the wait below cannot tell "correctly did
      # nothing" from "was supposed to deploy and didn't", and a docs-only
      # commit fails the run for no reason.
      - name: Did the frontend change?
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD -- frontend/; then
            echo "No frontend/ changes in $GITHUB_SHA - Vercel is expected to skip its build."
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend/ changed in $GITHUB_SHA - Vercel must produce a deployment."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

      # Vercel fires first, and deliberately: it is a bare POST with nothing
      # to parse, so nothing about the Render hook - a malformed URL, a
      # response shape change, an outage - can stop the frontend from
      # deploying. Ordered the other way, a Render-side problem would leave
      # the frontend pinned to whatever it was last serving, which is the
      # exact failure this whole job exists to make impossible.
      - name: Trigger Vercel deploy
        id: vercel
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK_URL"

      - name: Trigger Render deploys
        id: render
        env:
          WEB_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          WORKER_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          # Both Render services have autoDeploy off (render.yaml), so this
          # job is the only thing that deploys them - and it has to deploy
          # BOTH. The worker runs the web service's image, so shipping one
          # without the other leaves two halves of the app on different
          # commits, which is worse than either being stale.
          #
          # A missing worker hook used to `exit 1` right here, which meant a
          # gap in configuration stopped the *web* service from deploying too
          # - the guard against a half-deployed backend was itself preventing
          # any deploy at all. Missing config is now recorded and reported by
          # the last step in this job, so everything that CAN ship still does
          # and the run still goes red until the gap is closed.
          missing=''
          hooks=("$WEB_HOOK_URL")
          if [ -n "$WORKER_HOOK_URL" ]; then
            hooks+=("$WORKER_HOOK_URL")
          else
            # Optional, because the Celery worker render.yaml declares has not
            # actually been provisioned on Render - the dashboard has the web
            # service only. Demanding a hook for a service that does not exist
            # reddens every run over a gap nobody can close, and a warning
            # nobody can act on is the kind that teaches people to skip
            # warnings. See docs/OPERATIONS.md for what runs nowhere as a
            # result: the GitHub PR review pipeline.
            #
            # Provisioning the worker later is what makes this worth setting;
            # until then its absence is the accurate state, not a gap.
            echo "No RENDER_WORKER_DEPLOY_HOOK_URL - deploying the web service only."
            echo "That matches production today, which runs no Celery worker."
          fi
          if [ -z "$WEB_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set - there is nothing to deploy the" >&2
            echo "backend with. This one is fatal: it is the primary service." >&2
            exit 1
          fi
          deploys=''
          seen_services=''
          for hook in "${hooks[@]}"; do
            # Secrets carry whatever whitespace came with the paste. A newline
            # inside the URL makes curl reject it outright, which reads like a
            # wrong address rather than an invisible character.
            hook="$(printf '%s' "$hook" | tr -d '[:space:]')"
            # The service id is already inside the hook URL
            # (.../deploy/srv-xxxx?key=...), so deriving it beats another
            # secret that can silently drift out of sync with the hook.
            service_id="$(sed -n 's#.*/deploy/\(srv-[^/?]*\).*#\1#p' <<<"$hook")"
            if [ -z "$service_id" ]; then
              echo "No srv-... id found in one of the Render hook URLs. A Render deploy" >&2
              echo "hook looks like https://api.render.com/deploy/srv-XXXX?key=YYYY." >&2
              exit 1
            fi
            # Two hooks naming the same service means one secret holds a copy
            # of the other, and the worker is not being deployed despite a
            # secret that looks present. Caught here rather than at the second
            # POST, where Render answers "Accepted {}" - it is refusing a
            # duplicate deploy, but reads like a broken hook.
            case " $seen_services " in
              *" $service_id "*)
                echo "RENDER_DEPLOY_HOOK_URL and RENDER_WORKER_DEPLOY_HOOK_URL both point at" >&2
                echo "$service_id. One is a copy of the other, so the worker is not being" >&2
                echo "deployed. Take the worker's hook from ITS OWN service page:" >&2
                echo "Render > code-analyzer-celery-worker > Settings > Deploy Hook." >&2
                exit 1
                ;;
            esac
            seen_services="$seen_services $service_id"
            response="$(curl -fsS -X POST "$hook")"
            # jq must not be what fails here. Letting it abort the step under
            # `set -e` replaced a message naming the service and quoting the
            # response with a bare "parse error: Invalid numeric literal",
            # which says nothing about which hook broke or what came back.
            deploy_id="$(jq -r '.deploy.id // empty' <<<"$response" 2>/dev/null || true)"
            if [ -z "$deploy_id" ]; then
              echo "Render hook for $service_id returned no deploy id." >&2
              echo "It answered with:" >&2
              printf '%s\n' "$response" | head -5 >&2
              echo "A hook for a service that no longer exists, or a revoked key, answers" >&2
              echo "like this. Re-copy it from that service's Settings > Deploy Hook." >&2
              exit 1
            fi
            echo "Queued Render deploy $deploy_id on $service_id."
            deploys="$deploys $service_id/$deploy_id"
          done
          {
            echo "deploys=${deploys# }"
            echo "missing=$missing"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOYS: ${{ steps.render.outputs.deploys }}
        run: |
          set -euo pipefail
          # An absent key and a rejected key are different failures and get
          # different treatment. Absent means "verification was never wired
          # up" - the deploy still fired, so skip the poll, warn, and let the
          # final step redden the run. Rejected means a credential that exists
          # and does not work, which is a genuine fault worth stopping on.
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::RENDER_API_KEY is not set, so the Render deploys were fired but not verified. They may still fail after this run goes green-ish."
            exit 0
          fi
          # Both were queued in the step above, so Render builds them
          # concurrently - watching them one after the other costs roughly the
          # slower of the two, not the sum.
          for pair in $DEPLOYS; do
            service_id="${pair%%/*}"
            deploy_id="${pair##*/}"
            deadline=$(( SECONDS + 900 ))
            status=''
            while [ "$SECONDS" -lt "$deadline" ]; do
              # Status is read separately from the body so a rejected
              # credential can be told apart from a blip. Retrying a 401/403
              # is pointless - the answer will not change in 15 seconds or in
              # 15 minutes - and it buries the real cause under hundreds of
              # identical lines. Only transport failures and 5xx are retried.
              reply="$(curl -sS -w $'\n%{http_code}' \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H 'Accept: application/json' \
                "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" || true)"
              code="${reply##*$'\n'}"
              response="${reply%$'\n'*}"
              case "$code" in
                200) ;;
                401|403)
                  echo "Render API rejected the credential (HTTP $code). Check that the" >&2
                  echo "RENDER_API_KEY secret is set and still valid." >&2
                  exit 1
                  ;;
                404)
                  echo "Render API has no deploy $deploy_id on service $service_id (HTTP 404)." >&2
                  echo "The hook URL and the API key may belong to different accounts." >&2
                  exit 1
                  ;;
                *)
                  echo "Render API poll for $service_id returned HTTP ${code:-no response}; retrying."
                  sleep 15
                  continue
                  ;;
              esac
              status="$(jq -r '.status // empty' <<<"$response")"
              case "$status" in
                live)
                  echo "Render deploy $deploy_id on $service_id is live."
                  break
                  ;;
                # deactivated means a later deploy superseded this one, so the
                # commit this job is gating is not what production ends up
                # serving - not something to report as a success.
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "Render deploy $deploy_id on $service_id ended as '$status'." >&2
                  exit 1
                  ;;
              esac
              echo "Render deploy $deploy_id on $service_id: ${status:-unknown}"
              sleep 15
            done
            if [ "$status" != live ]; then
              echo "Timed out after 15m on Render deploy $deploy_id ($service_id), last status '${status:-unknown}'." >&2
              exit 1
            fi
          done

      - name: Wait for Vercel deploy
        # Runs even when the Render wait failed, so one provider's bad deploy
        # doesn't hide the other's outcome - but not when the hook never fired,
        # which would just burn the full 15 minutes waiting for nothing.
        if: ${{ !cancelled() && steps.vercel.outcome == 'success' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          # Same absent-vs-rejected split as the Render wait above.
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN and/or VERCEL_PROJECT_ID are not set, so the Vercel deploy was fired but not verified. A build that fails after this point will not be reported."
            exit 0
          fi
          query="projectId=$PROJECT_ID&target=production&limit=20"
          if [ -n "$TEAM_ID" ]; then
            query="$query&teamId=$TEAM_ID"
          fi
          deadline=$(( SECONDS + 900 ))
          state=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Same split as the Render poll above: a rejected credential is
            # not a blip, and retrying it for 15 minutes only buries the cause.
            reply="$(curl -sS -w $'\n%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?$query" || true)"
            code="${reply##*$'\n'}"
            response="${reply%$'\n'*}"
            case "$code" in
              200) ;;
              401|403)
                echo "Vercel API rejected the credential (HTTP $code)." >&2
                echo "Check VERCEL_TOKEN is set and valid. A 403 also comes back when the" >&2
                echo "project belongs to a team and VERCEL_TEAM_ID is unset - a personal" >&2
                echo "token cannot read a team's deployments without the team scope." >&2
                exit 1
                ;;
              404)
                echo "Vercel API does not recognise project '$PROJECT_ID' (HTTP 404)." >&2
                echo "VERCEL_PROJECT_ID should be the prj_... id from Settings > General." >&2
                exit 1
                ;;
              *)
                echo "Vercel API poll returned HTTP ${code:-no response}; retrying."
                sleep 15
                continue
                ;;
            esac
            # Matched on the commit rather than "the newest one", so a
            # deployment somebody else triggers mid-run can't be mistaken for
            # this one and reported as its result.
            state="$(jq -r --arg sha "$GITHUB_SHA" \
              '[.deployments[] | select(.meta.githubCommitSha == $sha)][0].state // ""' \
              <<<"$response")"
            case "$state" in
              READY)
                echo "Vercel deployment for $GITHUB_SHA is ready."
                exit 0
                ;;
              ERROR)
                echo "Vercel deployment for $GITHUB_SHA ended as 'ERROR' - the build failed." >&2
                echo "Open the deployment in Vercel; the build log has the reason." >&2
                exit 1
                ;;
              CANCELED)
                # CANCELED covers two unrelated things: a build Vercel chose
                # not to run because nothing under the Root Directory changed,
                # and one that was genuinely killed or superseded. Only the
                # frontend diff separates them.
                if [ "$FRONTEND_CHANGED" = 'true' ]; then
                  echo "Vercel deployment for $GITHUB_SHA was CANCELED even though this commit" >&2
                  echo "changes frontend/. Either a newer deployment superseded it, or the build" >&2
                  echo "was cancelled - check the deployment in Vercel." >&2
                  exit 1
                fi
                echo "Vercel skipped the build for $GITHUB_SHA (reported as CANCELED)."
                echo "That is correct: this commit changes nothing under frontend/, so the"
                echo "existing production deployment is still the right one."
                exit 0
                ;;
              '')
                echo "No Vercel deployment for $GITHUB_SHA yet."
                ;;
              *)
                echo "Vercel deployment for $GITHUB_SHA: $state"
                ;;
            esac
            sleep 15
          done
          echo "Timed out after 15m waiting on a Vercel deployment for $GITHUB_SHA (last state: '${state:-none}')." >&2
          echo "A state that never appeared at all points at the project's Git integration: a deploy hook only stamps meta.githubCommitSha while it is connected." >&2
          exit 1

      # The polls above prove each provider finished its build. These prove
      # the result is actually reachable and serving - a deploy can go READY
      # against a container that then crash-loops, or a Vercel alias that
      # never moved to the new deployment.
      #
      # Runs even if a wait failed, so a partial rollout still reports which
      # half of production is up. `-f` is what makes a 4xx/5xx fail the step;
      # without it curl exits 0 on an error page.
      #
      # URLs are `vars`, not `secrets`: they are public addresses, and keeping
      # them readable means a failure here names the host it could not reach
      # instead of printing three asterisks.
      - name: Smoke-test production
        if: ${{ !cancelled() }}
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL }}
        run: |
          set -uo pipefail
          failed=0
          checked=0

          check() {  # name, base-url, path, expected-substring (optional)
            local name="$1" base="$2" path="$3" want="${4:-}"
            # Emptiness is tested on the base, not the composed URL: an unset
            # variable joined to a path yields "/api/health/", which is not
            # empty and would sail past this check straight into a curl
            # against a relative path.
            # A value pasted into the Actions UI arrives with whatever
            # whitespace came with it. curl rejects a URL containing a stray
            # space or newline with "(3) Malformed input to a URL function",
            # which reads like a bug in the address rather than an invisible
            # character around it - and --retry then repeats it five times.
            base="$(printf '%s' "$base" | tr -d '[:space:]')"
            if [ -z "$base" ]; then
              echo "SKIP $name - no URL configured (set the repo variable)."
              return 0
            fi
            case "$base" in
              http://*|https://*) ;;
              *)
                echo "FAIL $name - '$base' is not a URL; it needs the https:// scheme." >&2
                failed=1
                return 0
                ;;
            esac
            checked=$((checked + 1))
            local url="${base%/}$path" body
            # --retry covers a container still finishing its first request;
            # -f turns any 4xx/5xx into a non-zero exit.
            if ! body="$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url")"; then
              echo "FAIL $name - $url did not return a success status." >&2
              failed=1
              return 0
            fi
            if [ -n "$want" ] && [[ "$body" != *"$want"* ]]; then
              echo "FAIL $name - $url responded, but did not contain '$want'." >&2
              failed=1
              return 0
            fi
            echo "OK   $name - $url"
          }

          # The health endpoint is the same one render.yaml points its own
          # healthCheckPath at, so a pass here means what Render means by up.
          check "backend health" "$BACKEND_URL" "/api/health/" '"status"'
          # Root of the SPA. Deliberately not a deep link: vercel.json rewrites
          # everything to index.html, so any path would 200 and prove nothing.
          check "frontend"       "$FRONTEND_URL" ""

          if [ "$failed" -ne 0 ]; then
            echo "Production is not serving correctly after deploy." >&2
            exit 1
          fi
          # Zero checks is not a pass. Reporting "Production is up" after
          # skipping every check states a fact this step did not establish -
          # the same false all-clear the deploy hooks used to give, in the one
          # step whose entire job is to catch that.
          if [ "$checked" -eq 0 ]; then
            echo "::warning::No smoke test ran - neither RENDER_BACKEND_URL nor VERCEL_FRONTEND_URL is set. Production was NOT verified."
            echo "Production was not verified: no URLs configured." >&2
            exit 0
          fi
          echo "Production is up ($checked of 2 checks ran and passed)."

      # Deploying and verifying are now separable: a missing secret skips a
      # check rather than blocking the release, so everything that can ship
      # still ships. This step is what stops that leniency turning into
      # silence - the run goes red until every gap is closed, because a
      # pipeline that deploys without verifying is exactly the state that let
      # a stale frontend sit behind green checkmarks for weeks.
      - name: Report configuration gaps
        if: ${{ !cancelled() }}
        env:
          MISSING_HOOK: ${{ steps.render.outputs.missing }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL }}
        run: |
          set -uo pipefail
          gaps=()
          # Only ever set when a hook was expected and absent. The worker is
          # not provisioned, so today this stays empty rather than billing
          # every run for a service that does not exist.
          [ -n "$MISSING_HOOK" ] && gaps+=("secret  $MISSING_HOOK - a declared service is not being deployed")
          [ -z "$RENDER_API_KEY" ]     && gaps+=("secret  RENDER_API_KEY - Render deploys fire unverified")
          [ -z "$VERCEL_TOKEN" ]       && gaps+=("secret  VERCEL_TOKEN - Vercel deploys fire unverified")
          [ -z "$VERCEL_PROJECT_ID" ]  && gaps+=("secret  VERCEL_PROJECT_ID - Vercel deploys fire unverified")
          [ -z "$BACKEND_URL" ]        && gaps+=("var     RENDER_BACKEND_URL - backend smoke test skipped")
          [ -z "$FRONTEND_URL" ]       && gaps+=("var     VERCEL_FRONTEND_URL - frontend smoke test skipped")

          if [ "${#gaps[@]}" -eq 0 ]; then
            echo "Deploy pipeline is fully configured."
            exit 0
          fi

          {
            echo "### Deploy pipeline is not fully configured"
            echo
            echo "The deploys that could be triggered **were** triggered. These gaps mean"
            echo "parts of the release went out unverified:"
            echo
            for gap in "${gaps[@]}"; do echo "- \`${gap}\`"; done
            echo
            echo "Repository → Settings → Secrets and variables → Actions."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Deploy pipeline is not fully configured:" >&2
          for gap in "${gaps[@]}"; do echo "  $gap" >&2; done
          exit 1
