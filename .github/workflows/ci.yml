name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL_DEV: postgresql://postgres:postgres@localhost:5432/code_analyzer_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Dummy key, CI-only - encrypts nothing that leaves this ephemeral test
      # database. Needed because there's no .env file in CI (it's gitignored)
      # for github_integration.services.encryption's _get_fernet() to read;
      # locally this comes from backend/.env instead, which is why this gap
      # never showed up in local test runs.
      GITHUB_TOKEN_ENCRYPTION_KEY: 3NLZPInEcOu-N9qM-FycYJtmb7Yld46CS6nLe4B-f28=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python manage.py check

      - run: python manage.py makemigrations --check --dry-run

      - run: python manage.py test

      # Dependency CVE audit. Non-blocking on purpose: the advisory feed moves
      # independently of this repo, so a hard failure here would red-line
      # builds for a newly-published CVE in a transitive dependency that the
      # PR under test never touched. It also currently reports advisories
      # against Django 4.2 itself, which are only fixable by a major-version
      # upgrade. Flip `continue-on-error` off once that backlog is cleared and
      # this becomes a real gate rather than a report.
      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Same rationale as the backend's pip-audit step above - see there.
      # --audit-level=high ignores low/moderate advisories so this reports
      # only what would actually warrant an out-of-band dependency bump.
      - name: Audit npm dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Only runs once backend+frontend CI passes, and only for pushes that land
  # on main (a merged PR is a push to main, so this covers "every merge" too)
  # - never for PRs or pushes to dev. `environment: production` is what pauses
  # this job for the required reviewer configured on that GitHub Environment;
  # Render's/Vercel's own auto-deploy-on-push must be turned off in their
  # dashboards for this to be the only path to production, otherwise they'd
  # deploy immediately on push regardless of this gate.
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
