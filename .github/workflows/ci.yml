name: CI

# The quality gate, and nothing else - deploying lives in deploy.yml.
#
# `workflow_call` is what makes this importable: deploy.yml runs it with
# `uses: ./.github/workflows/ci.yml` rather than repeating the steps, so the
# definition of "the tests" exists once and the deploy path cannot drift from
# what a PR was checked against.
#
# There is deliberately no `push:` trigger. deploy.yml is what handles a push
# to main, and it calls this workflow itself - listing push here as well would
# run every job twice for one commit. Listing `dev` under push had that same
# effect on a dev -> main PR: eight checks for three jobs, same commit, double
# the minutes. The trade is that a commit pushed straight to dev with no PR
# goes untested; work through PRs and nothing is lost.
on:
  pull_request:
    branches: [main, dev]
  workflow_call:

# One in-flight run per PR. Pushing a fixup while CI is still chewing on the
# previous commit cancels that run instead of racing it.
#
# `github.event.pull_request.number ||` still matters even though this only
# triggers on PRs: under `workflow_call` the event is deploy.yml's push, where
# that field is absent and `github.ref` is what identifies the run. Deploys
# are never cancelled - deploy.yml sets its own concurrency for that.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: code_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL_DEV: postgresql://postgres:postgres@localhost:5432/code_analyzer_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Dummy key, CI-only - encrypts nothing that leaves this ephemeral test
      # database. Needed because there's no .env file in CI (it's gitignored)
      # for github_integration.services.encryption's _get_fernet() to read;
      # locally this comes from backend/.env instead, which is why this gap
      # never showed up in local test runs.
      GITHUB_TOKEN_ENCRYPTION_KEY: 3NLZPInEcOu-N9qM-FycYJtmb7Yld46CS6nLe4B-f28=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python manage.py check

      - run: python manage.py makemigrations --check --dry-run

      - run: python manage.py test

      # Dependency CVE audit. Non-blocking on purpose: the advisory feed moves
      # independently of this repo, so a hard failure here would red-line
      # builds for a newly-published CVE in a transitive dependency that the
      # PR under test never touched. It also currently reports advisories
      # against Django 4.2 itself, which are only fixable by a major-version
      # upgrade. Flip `continue-on-error` off once that backlog is cleared and
      # this becomes a real gate rather than a report.
      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Same rationale as the backend's pip-audit step above - see there.
      # --audit-level=high ignores low/moderate advisories so this reports
      # only what would actually warrant an out-of-band dependency bump.
      - name: Audit npm dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
